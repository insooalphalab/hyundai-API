<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>시트룸 차량 디스플레이</title>
  <!-- 온라인 및 오프라인 대응 Pretendard 웹폰트 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <style>
    @font-face {
      font-family: "Pretendard Variable";
      font-weight: 45 920;
      font-display: swap;
      src: url("fonts/PretendardVariable.woff2") format("woff2");
    }

    /* -------------------------------------------------------------
       현대자동차 공식 전용색상 & 다크/라이트 듀얼 테마
    ------------------------------------------------------------- */
    :root {
      --bg-core: #0c0e12;
      --bg-panel: rgba(26, 30, 38, 0.88);
      --bg-card: rgba(35, 41, 52, 0.75);
      --bg-card-subtle: rgba(255, 255, 255, 0.04);
      --bg-soft: rgba(255, 255, 255, 0.06);

      --line-subtle: rgba(228, 220, 211, 0.14);
      --line-accent: rgba(170, 202, 230, 0.35);

      --text-main: #F6F3F2;   /* Hyundai Light Sand */
      --text-muted: #A36B4F;  /* Hyundai Gold */
      --text-dim: #9aa0a6;

      --c-h-blue: #002C5F;    /* Hyundai Blue */
      --c-h-gold: #A36B4F;    /* Hyundai Gold */
      --c-act-blue: #00AAD2;  /* Active Blue */
      --c-sky-blue: #AACAE6;  /* Sky Blue */
      --c-act-red: #E63312;   /* Active Red */
      --c-sand: #E4DCD3;      /* Hyundai Sand */
      --c-emerald: #00D287;   /* 안락/정상 상태 초록색 */

      --st-drive: #00AAD2;
      --st-rest: #A36B4F;
      --st-focus: #AACAE6;
      --st-warn: #E63312;
      --st-ok: #00D287;

      --glass-blur: blur(20px);
      --screen-shadow: 0 24px 60px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      color-scheme: dark;
    }

    [data-theme="light-sand"] {
      --bg-core: #F6F3F2;
      --bg-panel: #FFFFFF;
      --bg-card: rgba(246, 243, 242, 0.9);
      --bg-card-subtle: rgba(228, 220, 211, 0.35);
      --bg-soft: #EFE9E3;

      --line-subtle: rgba(228, 220, 211, 0.8);
      --line-accent: rgba(0, 44, 95, 0.25);

      --text-main: #1D1917;
      --text-muted: #7E6B5D;
      --text-dim: #8C7B6E;

      --st-drive: #002C5F;
      --st-rest: #A36B4F;
      --st-focus: #00AAD2;
      --st-warn: #E63312;
      --st-ok: #00875A;
      --c-emerald: #00875A;

      --glass-blur: blur(12px);
      --screen-shadow: 0 20px 48px rgba(163, 107, 79, 0.15), inset 0 1px 0 #ffffff;
      color-scheme: light;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #06080a;
      color: var(--text-main);
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      letter-spacing: -0.02em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      padding: 12px 16px 24px;
      user-select: none;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    [data-theme="light-sand"] body { background: #ded5cb; }

    .wrap {
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 2px 6px;
    }
    .top-titles h1 {
      font-size: 18px;
      font-weight: 700;
      margin: 0 0 2px;
      color: #F6F3F2;
      letter-spacing: -0.025em;
    }
    [data-theme="light-sand"] .top-titles h1 { color: #2B2522; }
    .top-titles p {
      margin: 0;
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 400;
    }
    .top-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .ctl-btn {
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      background: var(--bg-soft);
      border: 1px solid var(--line-subtle);
      border-radius: 999px;
      padding: 6px 14px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .ctl-btn:hover {
      border-color: var(--line-accent);
      transform: translateY(-1px);
    }
    .ctl-btn[aria-pressed="true"] {
      background: var(--c-act-blue);
      color: #fff;
      border-color: var(--c-act-blue);
      box-shadow: 0 3px 12px rgba(0, 170, 210, 0.35);
    }

    .screen {
      container-type: size;
      width: 100%;
      height: clamp(560px, calc(100vh - 76px), 880px);
      background: radial-gradient(circle at 50% 6%, #1a2332 0%, var(--bg-core) 90%);
      border-radius: 22px;
      border: 1px solid var(--line-subtle);
      box-shadow: var(--screen-shadow);
      overflow: hidden;
      position: relative;
      transition: background 0.35s ease;
    }
    [data-theme="light-sand"] .screen {
      background: radial-gradient(circle at 50% 0%, #FFFFFF 0%, var(--bg-core) 100%);
    }

    .in {
      position: absolute;
      inset: 0;
      padding: clamp(16px, 2.2cqh, 24px) clamp(20px, 2.4cqw, 32px);
      display: flex;
      flex-direction: column;
      gap: clamp(10px, 1.6cqh, 16px);
    }

    .hd {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .brand {
      font-size: clamp(20px, 2.5cqw, 30px);
      font-weight: 800;
      letter-spacing: -0.035em;
      color: var(--text-main);
      background: linear-gradient(135deg, #FFFFFF 30%, var(--c-sky-blue) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    [data-theme="light-sand"] .brand {
      background: linear-gradient(135deg, var(--c-h-blue) 0%, var(--c-act-blue) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .tag {
      font-size: clamp(13px, 1.3cqw, 16px);
      color: var(--text-muted);
      font-weight: 500;
    }
    .live-badge {
      display: none;
      font-size: 13px;
      font-weight: 600;
      color: var(--c-act-blue);
      align-items: center;
      gap: 6px;
      background: rgba(0, 170, 210, 0.12);
      padding: 4px 10px;
      border-radius: 999px;
    }
    .live-badge::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--c-act-blue);
      box-shadow: 0 0 8px var(--c-act-blue);
    }
    .live-badge.on { display: inline-flex; }

    .sp { flex: 1; }

    .pill {
      font: inherit;
      font-size: clamp(12px, 1.2cqw, 15px);
      font-weight: 600;
      color: var(--text-main);
      background: var(--bg-soft);
      border: 1px solid var(--line-subtle);
      border-radius: 999px;
      padding: 6px 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .pill:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--line-accent);
      transform: translateY(-1px);
    }
    .pill:active { transform: scale(0.96); }
    .pill.cool {
      border-color: var(--c-act-blue);
      color: var(--c-act-blue);
      background: rgba(0, 170, 210, 0.08);
    }

    .tabs {
      display: flex;
      border-bottom: 1.5px solid var(--line-subtle);
      gap: 24px;
      flex-shrink: 0;
    }
    .tabs button {
      font: inherit;
      font-size: clamp(15px, 1.6cqw, 19px);
      font-weight: 700;
      color: var(--text-dim);
      background: none;
      border: 0;
      padding: 8px 4px;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s ease;
    }
    .tabs button[aria-selected="true"] {
      color: var(--text-main);
      border-bottom-color: var(--c-act-blue);
    }
    [data-theme="light-sand"] .tabs button[aria-selected="true"] {
      border-bottom-color: var(--c-h-blue);
      color: var(--c-h-blue);
    }

    .view {
      flex: 1;
      min-height: 0;
      display: flex;
      gap: clamp(14px, 1.8cqw, 24px);
    }
    [hidden] { display: none !important; }

    /* 좌측 콕핏 및 좌석 */
    .carbox {
      flex: 1.05;
      display: flex;
      justify-content: center;
      align-items: stretch;
      min-height: 0;
      height: 100%;
    }
    .car {
      height: 100%;
      width: 100%;
      max-width: 440px;
      border: 2px solid var(--line-subtle);
      border-radius: 54px 54px 34px 34px;
      padding: clamp(14px, 2.4cqh, 24px) clamp(14px, 2cqw, 20px) clamp(10px, 1.8cqh, 16px);
      display: flex;
      flex-direction: column;
      gap: clamp(8px, 1.4cqh, 14px);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.02) 0%, rgba(255, 255, 255, 0.05) 100%);
      box-shadow: inset 0 0 32px rgba(0, 0, 0, 0.4);
    }
    [data-theme="light-sand"] .car {
      background: linear-gradient(180deg, rgba(228, 220, 211, 0.25) 0%, rgba(228, 220, 211, 0.5) 100%);
      box-shadow: inset 0 0 20px rgba(163, 107, 79, 0.08);
    }
    .front {
      text-align: center;
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .row {
      flex: 1;
      display: flex;
      gap: clamp(10px, 1.5cqw, 14px);
      min-height: 0;
    }

    .seat {
      flex: 1;
      border-radius: 20px;
      border: 1.5px solid var(--line-subtle);
      background: var(--bg-card);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: clamp(8px, 1.5cqh, 14px) clamp(4px, 0.8cqw, 10px);
      cursor: pointer;
      color: inherit;
      font: inherit;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
    }
    .seat:hover {
      border-color: var(--line-accent);
      transform: translateY(-2px);
    }
    .seat:active { transform: scale(0.96); }

    .seat .lb {
      font-size: clamp(12px, 1.15cqw, 14px);
      color: var(--text-dim);
      font-weight: 600;
    }
    .seat .ow {
      font-size: clamp(14px, 1.45cqw, 18px);
      font-weight: 700;
      color: var(--text-main);
    }
    .seat .md {
      font-size: clamp(18px, 2cqw, 24px);
      font-weight: 800;
      color: var(--text-dim);
      letter-spacing: -0.02em;
    }
    .seat .tp {
      font-size: clamp(13px, 1.3cqw, 16px);
      font-weight: 700;
      font-feature-settings: "tnum";
      color: var(--text-muted);
    }
    .seat svg {
      width: clamp(38px, 4.8cqw, 56px);
      height: clamp(38px, 4.8cqw, 56px);
      max-height: 38%;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.25));
    }

    .seat.drive {
      border-color: var(--c-act-blue);
      background: radial-gradient(circle at 50% 40%, rgba(0, 170, 210, 0.25) 0%, rgba(26, 30, 38, 0.92) 100%);
      box-shadow: 0 0 22px rgba(0, 170, 210, 0.3);
    }
    .seat.drive .md { color: #fff; }
    [data-theme="light-sand"] .seat.drive {
      border-color: var(--c-h-blue);
      background: linear-gradient(180deg, #FFFFFF 0%, rgba(170, 202, 230, 0.45) 100%);
      box-shadow: 0 8px 20px rgba(0, 44, 95, 0.2);
    }
    [data-theme="light-sand"] .seat.drive .md { color: var(--c-h-blue); }

    .seat.rest {
      border-color: var(--c-h-gold);
      background: radial-gradient(circle at 50% 40%, rgba(163, 107, 79, 0.28) 0%, rgba(26, 30, 38, 0.92) 100%);
      box-shadow: 0 0 22px rgba(163, 107, 79, 0.3);
    }
    .seat.rest .md { color: #fff; }
    [data-theme="light-sand"] .seat.rest {
      border-color: var(--c-h-gold);
      background: linear-gradient(180deg, #FFFFFF 0%, rgba(163, 107, 79, 0.3) 100%);
      box-shadow: 0 8px 20px rgba(163, 107, 79, 0.2);
    }
    [data-theme="light-sand"] .seat.rest .md { color: var(--c-h-gold); }

    .seat.focus {
      border-color: var(--c-sky-blue);
      background: radial-gradient(circle at 50% 40%, rgba(170, 202, 230, 0.25) 0%, rgba(26, 30, 38, 0.92) 100%);
      box-shadow: 0 0 22px rgba(170, 202, 230, 0.3);
    }
    .seat.focus .md { color: #fff; }
    [data-theme="light-sand"] .seat.focus {
      border-color: var(--c-act-blue);
      background: linear-gradient(180deg, #FFFFFF 0%, rgba(0, 170, 210, 0.25) 100%);
      box-shadow: 0 8px 20px rgba(0, 170, 210, 0.2);
    }
    [data-theme="light-sand"] .seat.focus .md { color: var(--c-act-blue); }

    .seat.sel {
      box-shadow: 0 0 0 2.5px #fff, 0 0 28px rgba(255, 255, 255, 0.45) !important;
    }
    [data-theme="light-sand"] .seat.sel {
      box-shadow: 0 0 0 2.5px var(--c-h-blue), 0 0 24px rgba(0, 44, 95, 0.35) !important;
    }

    .hint {
      text-align: center;
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 500;
      flex-shrink: 0;
    }

    /* -------------------------------------------------------------
       우측 패널: 빈칸 없이 꽉 차는 레이아웃 & 게이지 높이 확장
    ------------------------------------------------------------- */
    .side {
      flex: 1.4;
      display: flex;
      flex-direction: column;
      gap: clamp(10px, 1.4cqh, 14px);
      min-height: 0;
      height: 100%;
    }
    .tile {
      background: var(--bg-panel);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-radius: 20px;
      border: 1px solid var(--line-subtle);
      padding: clamp(12px, 1.8cqh, 18px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }
    [data-theme="light-sand"] .tile {
      box-shadow: 0 8px 22px rgba(163, 107, 79, 0.1);
    }

    .learn {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: clamp(12px, 1.8cqh, 18px);
      min-height: 0;
      justify-content: space-between; /* 빈칸 없이 전체 높이를 자연스럽게 채움 */
    }
    .lh {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .lh .nm {
      font-size: clamp(18px, 2.1cqw, 24px);
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.03em;
    }
    .lh .sl {
      font-size: clamp(12px, 1.2cqw, 14px);
      color: var(--text-dim);
      font-weight: 600;
    }

    .seg {
      display: flex;
      background: var(--bg-soft);
      border: 1px solid var(--line-subtle);
      border-radius: 999px;
      padding: 3px;
      gap: 3px;
    }
    .seg button {
      white-space: nowrap;
      font: inherit;
      font-size: clamp(12px, 1.25cqw, 14.5px);
      font-weight: 700;
      color: var(--text-dim);
      background: none;
      border: 0;
      border-radius: 999px;
      padding: 5px 13px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .seg button[aria-pressed="true"] { color: #fff; }
    .seg button[data-m="drive"][aria-pressed="true"] {
      background: var(--c-act-blue);
      box-shadow: 0 2px 10px rgba(0, 170, 210, 0.4);
    }
    [data-theme="light-sand"] .seg button[data-m="drive"][aria-pressed="true"] {
      background: var(--c-h-blue);
    }
    .seg button[data-m="rest"][aria-pressed="true"] {
      background: var(--c-h-gold);
      box-shadow: 0 2px 10px rgba(163, 107, 79, 0.4);
    }
    .seg button[data-m="focus"][aria-pressed="true"] {
      background: var(--c-sky-blue);
      color: #002C5F;
      box-shadow: 0 2px 10px rgba(170, 202, 230, 0.4);
    }
    .seg button[data-m=""][aria-pressed="true"] {
      background: var(--text-dim);
    }

    /* 1. 오늘 자리가 먼저 맞춘 것 (Auto-Applied Action Card) */
    .today-card {
      background: linear-gradient(135deg, rgba(0, 170, 210, 0.14) 0%, rgba(35, 41, 52, 0.8) 100%);
      border: 1.5px solid rgba(0, 170, 210, 0.4);
      border-radius: 18px;
      padding: clamp(12px, 1.8cqh, 18px) clamp(14px, 1.6cqw, 22px);
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    [data-theme="light-sand"] .today-card {
      background: linear-gradient(135deg, rgba(0, 44, 95, 0.05) 0%, rgba(255, 255, 255, 0.98) 100%);
      border-color: rgba(0, 44, 95, 0.22);
      box-shadow: 0 6px 18px rgba(163, 107, 79, 0.08);
    }
    .today-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .today-tag {
      font-size: clamp(12.5px, 1.25cqw, 15px);
      font-weight: 700;
      color: var(--c-act-blue);
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    [data-theme="light-sand"] .today-tag { color: var(--c-h-blue); }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: clamp(12px, 1.2cqw, 14px);
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(0, 210, 135, 0.16);
      color: var(--c-emerald);
      border: 1.5px solid rgba(0, 210, 135, 0.4);
    }
    .status-badge.modified {
      background: rgba(163, 107, 79, 0.2);
      color: var(--c-h-gold);
      border-color: rgba(163, 107, 79, 0.5);
    }
    .today-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .today-item {
      background: rgba(0, 0, 0, 0.28);
      border-radius: 14px;
      padding: clamp(8px, 1.4cqh, 14px) clamp(10px, 1.3cqw, 16px);
      display: flex;
      flex-direction: column;
      gap: 2px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }
    [data-theme="light-sand"] .today-item {
      background: rgba(228, 220, 211, 0.45);
      border-color: rgba(228, 220, 211, 0.8);
    }
    .today-item .val {
      font-size: clamp(20px, 2.3cqw, 28px);
      font-weight: 800;
      font-feature-settings: "tnum";
      color: var(--text-main);
      letter-spacing: -0.03em;
    }
    .today-item .lbl {
      font-size: clamp(11.5px, 1.1cqw, 13.5px);
      color: var(--text-dim);
      font-weight: 600;
    }

    /* 2. 이 자리는 우리 나 (Preference & Confidence Card) - 게이지 및 폰트 대폭 확대 */
    .pref-intel-card {
      flex: 1; /* 가용 세로 공간을 꽉 채워 배치 */
      background: var(--bg-card);
      border: 1.5px solid var(--line-subtle);
      border-radius: 20px;
      padding: clamp(16px, 2.2cqh, 24px) clamp(16px, 1.8cqw, 24px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: clamp(12px, 1.8cqh, 20px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    }
    [data-theme="light-sand"] .pref-intel-card {
      box-shadow: 0 8px 22px rgba(163, 107, 79, 0.1);
    }
    .pref-intel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .pref-intel-title {
      font-size: clamp(17px, 1.9cqw, 23px);
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }
    .pref-intel-title .owner-name {
      font-weight: 800;
      color: var(--text-main);
    }
    .confidence-score {
      font-size: clamp(13.5px, 1.35cqw, 16.5px);
      font-weight: 700;
      color: var(--c-h-gold);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .confidence-score strong {
      font-size: 1.15em;
      color: var(--text-main);
      font-feature-settings: "tnum";
    }
    .intel-rows {
      display: flex;
      flex-direction: column;
      gap: clamp(14px, 2.5cqh, 24px);
      flex: 1;
      justify-content: center;
    }
    .intel-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: clamp(12px, 1.6cqw, 22px);
    }
    /* 좌측 라벨 대폭 확대: 18~24px 굵고 시원하게 */
    .intel-label {
      color: var(--text-main);
      font-weight: 800;
      font-size: clamp(18px, 1.9cqw, 24px);
      letter-spacing: -0.03em;
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: clamp(90px, 9cqw, 125px);
      flex-shrink: 0;
    }
    /* 게이지 막대 높이 대폭 확대: 32~44px로 두툼하고 웅장한 필(Pill) 바 */
    .intel-bar-wrap {
      flex: 1;
      height: clamp(32px, 4.2cqh, 44px);
      background: var(--bg-soft);
      border: 1.5px solid var(--line-subtle);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.45);
    }
    [data-theme="light-sand"] .intel-bar-wrap {
      background: rgba(228, 220, 211, 0.55);
      box-shadow: inset 0 2px 5px rgba(163, 107, 79, 0.18);
      border-color: rgba(228, 220, 211, 0.9);
    }
    .intel-bar-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--c-sky-blue) 0%, var(--c-act-blue) 100%);
      box-shadow: 0 0 16px rgba(0, 170, 210, 0.5);
      transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    [data-theme="light-sand"] .intel-bar-fill {
      background: linear-gradient(90deg, var(--c-act-blue) 0%, var(--c-h-blue) 100%);
      box-shadow: 0 3px 10px rgba(0, 44, 95, 0.3);
    }
    /* 우측 상태/수치 텍스트 대폭 확대: 17~23px 시인성 극대화 */
    .intel-stat {
      font-weight: 800;
      color: var(--text-main);
      font-feature-settings: "tnum";
      white-space: nowrap;
      font-size: clamp(17px, 1.8cqw, 23px);
      letter-spacing: -0.025em;
      min-width: clamp(190px, 19cqw, 260px);
      text-align: right;
      flex-shrink: 0;
    }

    /* 3. 직접 고친 횟수 근거 (한 줄 캡슐) */
    .impact-pill {
      background: var(--bg-card-subtle);
      border: 1.5px solid var(--line-subtle);
      border-radius: 14px;
      padding: clamp(10px, 1.4cqh, 14px) clamp(14px, 1.5cqw, 20px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: clamp(12.5px, 1.25cqw, 14.5px);
      color: var(--text-dim);
      font-weight: 600;
    }
    .impact-pill strong {
      color: var(--text-main);
      font-weight: 800;
      font-feature-settings: "tnum";
    }
    .impact-pill .highlight {
      color: var(--c-emerald);
      font-weight: 800;
    }

    .mini2 {
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }
    .mini2 .tile {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: clamp(10px, 1.4cqh, 14px) clamp(12px, 1.2cqw, 16px);
      border-radius: 16px;
    }
    .mini2 .big {
      font-size: clamp(14px, 1.5cqw, 18px);
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }
    .mini2 .small {
      font-size: clamp(11px, 1.05cqw, 13px);
      color: var(--text-dim);
      font-weight: 500;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex: none;
      background: currentColor;
      box-shadow: 0 0 10px currentColor;
    }
    .legend {
      display: flex;
      gap: 16px;
      font-size: clamp(11px, 1.05cqw, 13px);
      color: var(--text-dim);
      align-items: center;
      padding-top: 2px;
      flex-shrink: 0;
    }
    .legend i {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 3px;
      margin-right: 4px;
      vertical-align: -0.1em;
    }

    .why {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .why div {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-soft);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: clamp(12px, 1.2cqw, 14px);
    }
    .why i {
      flex: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-style: normal;
      font-weight: 800;
      font-size: 12px;
      color: #fff;
      background: var(--c-h-gold);
    }
    .why i.no { background: var(--text-dim); }
    .why i.same { background: var(--c-act-blue); }
    .why i.wait { background: var(--text-dim); }
    .why i.step { background: none; color: var(--text-main); border: 1.5px solid var(--line-subtle); }

    /* 탑승 인식: 자리가 먼저 알아보고(자동), 틀렸을 때만 사람이 고친다 */
    .id-strip {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-soft);
      border: 1px solid var(--line-subtle);
      border-radius: 12px;
      padding: 7px 12px;
      font-size: clamp(12px, 1.2cqw, 14px);
      font-weight: 700;
      flex-shrink: 0;
    }
    .id-strip .tag {
      flex: none;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 999px;
      color: #fff;
      background: var(--c-act-blue);
    }
    .id-strip .tag.person { background: var(--c-h-gold); }
    .id-strip .tx { flex: 1; min-width: 0; }
    .id-strip small {
      display: block;
      color: var(--text-dim);
      font-size: 11.5px;
      font-weight: 500;
      margin-top: 1px;
    }
    .fix {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .fix .q, .acts .q {
      flex: none;
      align-self: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
    }
    .chip.sm { font-size: 12px; padding: 4px 11px; }
    .chip.hint { border-color: var(--c-h-gold); color: var(--c-h-gold); box-shadow: 0 0 0 3px rgba(163, 107, 79, 0.25); }
    .example {
      font-size: clamp(12px, 1.2cqw, 13.5px);
      color: var(--c-h-gold);
      font-weight: 600;
      line-height: 1.45;
      flex-shrink: 0;
    }
    .dots { display: inline-flex; gap: 4px; vertical-align: middle; }
    .dots b { width: 8px; height: 8px; border-radius: 50%; background: var(--line-subtle); }
    .dots b.on { background: var(--c-act-blue); }
    .seat .dim { opacity: 0.45; }
    .why span {
      color: var(--text-dim);
      font-size: 12px;
      margin-left: auto;
      text-align: right;
    }
    .acts {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }
    .acts .btn { flex: 1; }
    .btn {
      font: inherit;
      font-weight: 700;
      font-size: clamp(13px, 1.3cqw, 16px);
      border: 0;
      border-radius: 12px;
      padding: 9px 14px;
      cursor: pointer;
      color: #fff;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn:active { transform: scale(0.97); }
    .btn.line {
      background: none;
      color: var(--text-main);
      border: 1.5px solid var(--line-subtle);
    }
    .btn.gold {
      background: var(--c-h-gold);
      box-shadow: 0 4px 12px rgba(163, 107, 79, 0.3);
    }
    .btn.sm {
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 8px;
    }
    .btn.warn {
      background: var(--c-act-red);
      box-shadow: 0 4px 12px rgba(230, 51, 18, 0.3);
    }
    .btn.ok { background: var(--c-act-blue); }
    .verdict {
      font-size: clamp(12px, 1.2cqw, 14px);
      color: var(--text-dim);
      font-weight: 500;
    }

    /* 평소의 나 탭 (4축 그래프) */
    .base {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: clamp(10px, 1.5cqh, 16px);
      min-height: 0;
      height: 100%;
    }
    .brow {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .who {
      font-size: clamp(16px, 1.8cqw, 21px);
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .chip {
      white-space: nowrap;
      font: inherit;
      font-size: clamp(12px, 1.2cqw, 15px);
      font-weight: 700;
      border: 1.5px solid var(--line-subtle);
      color: var(--text-main);
      background: var(--bg-soft);
      border-radius: 999px;
      padding: 6px 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .chip[aria-pressed="true"] {
      background: var(--c-act-blue);
      color: #fff;
      border-color: var(--c-act-blue);
    }
    [data-theme="light-sand"] .chip[aria-pressed="true"] {
      background: var(--c-h-blue);
      border-color: var(--c-h-blue);
    }

    .axes {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(8px, 1.2cqw, 14px);
      min-height: 0;
    }
    .ax {
      background: var(--bg-panel);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-radius: 18px;
      border: 1.5px solid var(--line-subtle);
      padding: clamp(12px, 1.6cqh, 18px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 6px 18px rgba(0,0,0,0.2);
    }
    .ax.changed {
      border-color: var(--c-h-gold);
      background: radial-gradient(circle at 50% 0%, rgba(163, 107, 79, 0.25) 0%, var(--bg-panel) 100%);
    }
    .ax .n {
      font-size: clamp(16px, 1.8cqw, 22px);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text-main);
    }
    .ax svg {
      width: 100%;
      height: clamp(36px, 5cqh, 50px);
    }
    .ax .st {
      font-size: clamp(17px, 2cqw, 24px);
      font-weight: 800;
      letter-spacing: -0.03em;
      font-feature-settings: "tnum";
    }
    .ax .q {
      font-size: clamp(11px, 1.05cqw, 13px);
      color: var(--text-dim);
      font-weight: 500;
    }

    .lower {
      flex: 1.2;
      display: flex;
      gap: clamp(8px, 1.2cqw, 14px);
      min-height: 0;
    }
    .alert {
      flex: 2;
      border-radius: 18px;
      border: 1.5px solid var(--line-subtle);
      background: var(--bg-panel);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      padding: clamp(12px, 1.6cqh, 18px);
      display: flex;
      flex-direction: column;
      gap: clamp(6px, 1cqh, 10px);
    }
    .alert.sent {
      border-color: var(--c-h-gold);
      background: radial-gradient(circle at 10% 50%, rgba(163, 107, 79, 0.22) 0%, var(--bg-panel) 90%);
    }
    .alert.calm {
      border-color: var(--c-act-blue);
      background: radial-gradient(circle at 10% 50%, rgba(0, 170, 210, 0.16) 0%, var(--bg-panel) 90%);
    }
    .alert .h {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: clamp(16px, 1.8cqw, 22px);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text-main);
    }
    .alert svg {
      width: clamp(26px, 3cqw, 34px);
      height: clamp(26px, 3cqw, 34px);
      flex: none;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tg {
      font-size: clamp(11px, 1.15cqw, 13px);
      font-weight: 700;
      border-radius: 999px;
      padding: 4px 10px;
    }
    .tg.w {
      color: #fff;
      background: var(--c-h-gold);
    }
    .tg.c {
      color: #fff;
      background: var(--c-act-blue);
    }
    .opts.big { flex: 1; margin-top: 4px; }
    .opts.big button { font-size: clamp(14px, 1.6cqw, 19px); font-weight: 800; border-radius: 14px; }
    .msgs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; }
    .msg { display: flex; align-items: center; gap: 8px; font-size: clamp(12px, 1.2cqw, 15px); line-height: 1.3; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .msg .tg { flex: none; font-size: 11px; padding: 3px 8px; }
    .msg.dim { color: var(--text-dim); }
    .alert .f {
      font-size: clamp(11px, 1.1cqw, 13px);
      color: var(--text-dim);
      font-weight: 500;
    }

    .trend {
      flex: 1;
      background: var(--bg-panel);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-radius: 18px;
      border: 1.5px solid var(--line-subtle);
      padding: clamp(12px, 1.6cqh, 18px);
      display: flex;
      flex-direction: column;
      gap: clamp(6px, 1cqh, 10px);
    }
    .trend .t {
      font-size: clamp(14px, 1.45cqw, 18px);
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .trend .v {
      font-size: clamp(15px, 1.7cqw, 21px);
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .trend svg {
      flex: 1;
      min-height: 0;
      width: 100%;
    }

    .opts {
      display: flex;
      gap: 6px;
      margin-top: auto;
    }
    .opts button {
      flex: 1;
      font: inherit;
      font-size: clamp(12px, 1.2cqw, 14px);
      font-weight: 700;
      color: var(--text-main);
      background: var(--bg-card);
      border: 1.5px solid var(--line-subtle);
      border-radius: 10px;
      padding: 7px 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .opts button[aria-pressed="true"] {
      background: var(--c-act-blue);
      color: #fff;
      border-color: var(--c-act-blue);
    }
    [data-theme="light-sand"] .opts button[aria-pressed="true"] {
      background: var(--c-h-blue);
      border-color: var(--c-h-blue);
    }

    .rulebox {
      font-size: clamp(11px, 1.1cqw, 13px);
      color: var(--text-dim);
      background: var(--bg-soft);
      border: 1px solid var(--line-subtle);
      border-radius: 999px;
      padding: 5px 12px;
      font-weight: 600;
    }

    /* 시나리오 그리드 */
    .pick {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(10px, 1.5cqw, 18px);
      min-height: 0;
    }
    .card {
      background: var(--bg-panel);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1.5px solid var(--line-subtle);
      border-radius: 20px;
      padding: clamp(12px, 1.8cqh, 18px);
      display: flex;
      flex-direction: column;
      gap: 8px;
      cursor: pointer;
      text-align: left;
      color: inherit;
      font: inherit;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }
    .card:hover {
      border-color: var(--c-act-blue);
      transform: translateY(-4px);
      box-shadow: 0 14px 34px rgba(0, 170, 210, 0.22);
    }
    .card:active { transform: scale(0.98); }
    .mini {
      width: 100%;
      flex: 1;
      min-height: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .mini .car {
      max-width: 100%;
      max-height: 100%;
      height: 100%;
      width: 100%;
      border-width: 1.5px;
      border-radius: 36px 36px 20px 20px;
      padding: 14px 10px 10px;
      gap: 6px;
    }
    .mini .row { gap: 6px; }
    .mini .seat {
      border-radius: 10px;
      padding: 2px;
      justify-content: center;
      cursor: inherit;
    }
    .mini .seat svg {
      width: clamp(26px, 3.4cqw, 42px);
      height: clamp(26px, 3.4cqw, 42px);
    }
    .card .n {
      font-size: clamp(15px, 1.8cqw, 22px);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text-main);
    }
    .card .k {
      font-size: clamp(12px, 1.2cqw, 14px);
      color: var(--text-dim);
      font-weight: 600;
    }
    .card .p {
      font-size: clamp(12px, 1.25cqw, 15px);
      color: var(--c-act-blue);
      font-weight: 700;
    }
    .q2 {
      font-size: clamp(14px, 1.5cqw, 18px);
      color: var(--text-dim);
      font-weight: 600;
    }

    /* 주행 뷰 */
    .dgrid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(12px, 1.8cqw, 24px);
    }
    .big3 {
      border-radius: 22px;
      border: 1.5px solid var(--line-subtle);
      background: var(--bg-panel);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
      padding: clamp(14px, 2cqh, 24px);
      box-shadow: 0 10px 28px rgba(0,0,0,0.3);
    }
    .big3 b {
      font-size: clamp(24px, 3.2cqw, 38px);
      font-weight: 800;
      letter-spacing: -0.04em;
    }
    .big3 span {
      font-size: clamp(15px, 1.8cqw, 22px);
      color: var(--text-dim);
      font-weight: 700;
    }

    /* 모바일 팝업 */
    .phone {
      position: absolute;
      right: 2.5%;
      top: 6%;
      width: clamp(260px, 25cqw, 320px);
      max-height: 86%;
      background: #10141a;
      color: #F6F3F2;
      border-radius: 24px;
      border: 2px solid var(--line-subtle);
      box-shadow: 0 20px 50px rgba(0,0,0,0.85);
      overflow-y: auto;
      padding: 18px 16px;
      font-size: 13px;
      z-index: 100;
    }
    [data-theme="light-sand"] .phone {
      background: #F4F6F8;
      color: #15202B;
    }
    .phone h4 {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
    }
    .phone .m {
      color: var(--text-dim);
      font-size: 12px;
      margin-top: 2px;
    }
    .phone .c {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--line-subtle);
      border-left: 4px solid var(--c-h-gold);
      border-radius: 12px;
      padding: 10px;
      margin-top: 10px;
    }
    [data-theme="light-sand"] .phone .c { background: #fff; }
    .phone .x {
      position: absolute;
      top: 12px;
      right: 14px;
      background: none;
      border: 0;
      font-size: 18px;
      cursor: pointer;
      color: var(--text-dim);
    }
    .phone .c.warn { border-left-color: var(--c-act-red); }
    .phone .c.ok { border-left-color: var(--c-act-blue); }
    .phone .ph { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; }
    .phone .ph small { font-weight: 500; color: var(--text-dim); font-size: 11.5px; }
    .phone .lv { margin-left: auto; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: rgba(163,107,79,.18); color: var(--c-h-gold); white-space: nowrap; }
    .phone .lv.warn { background: rgba(230,51,18,.16); color: var(--c-act-red); }
    .phone .lv.ok { background: rgba(0,170,210,.14); color: var(--c-act-blue); }
    .phone .hl { margin-top: 6px; font-size: 13.5px; font-weight: 600; line-height: 1.4; }
    .phone .ln { margin-top: 6px; line-height: 1.4; }
    .phone .ln small { display: block; color: var(--text-dim); font-size: 11.5px; }
    .phone .sec { margin-top: 8px; font-size: 11px; font-weight: 700; color: var(--text-dim); letter-spacing: .04em; }
    .phone svg {
      width: 100%;
      height: 44px;
      display: block;
      margin-top: 4px;
    }

    .app body {
      padding: 0;
      background: var(--bg-core);
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .app .wrap {
      max-width: none;
      width: 100vw;
      height: 100vh;
      gap: 0;
    }
    .app .top-bar { display: none; }

  </style>

<body>

<script>
const $ = id => document.getElementById(id);
const SEATS = [["DRIVER","운전석"],["PASSENGER","동승석"],["REAR_LEFT","뒷좌석 왼쪽"],["REAR_RIGHT","뒷좌석 오른쪽"]];
const AX = [
  {k:"perf",n:"수행",q:"조향 방향 전환(분당)",u:"회/분",min:.8},
  {k:"pos",n:"자세",q:"주행 중 자세 고침",u:"회",min:1.2},
  {k:"vis",n:"시야 보상",q:"수동 상향등 시간",u:"분",min:.5},
  {k:"plan",n:"계획",q:"깜빡이 → 조향 간격",u:"초",min:.4},
];

const SC = [
  {id:"S1",title:"10만 km 넘은 안전운전자",kind:"가족",pitch:"아이는 자고, 알림은 꼭 필요할 때만",
   occ:["DRIVER","PASSENGER","REAR_LEFT","REAR_RIGHT"],modes:{DRIVER:"drive",REAR_LEFT:"rest",REAR_RIGHT:"rest"},
   owners:{DRIVER:[{name:"아빠",n:126,t:21.5,fan:3,hv:"통풍 1"}],PASSENGER:[{name:"엄마",n:84,t:23.5,fan:2,hv:"열선 1"}],
     REAR_LEFT:[{name:"첫째",n:61,t:22,fan:2,hv:"없음"}],REAR_RIGHT:[{name:"둘째",n:7,t:23,fan:1,hv:"열선 1"}]},
   people:[{name:"아빠",b:{perf:[10.5,.6],pos:[.6,.7],vis:[.2,.35],plan:[3.4,.25]}}],rule:{z:2,min:2,trend:false,heat:0}},
  {id:"S2",title:"고령 운전자",kind:"개인",pitch:"작은 변화와 몇 주 추세까지",
   occ:["DRIVER"],modes:{DRIVER:"drive"},
   owners:{DRIVER:[{name:"어르신",n:92,t:24.5,fan:1,hv:"열선 2"}],},seen:{PASSENGER:3},
   people:[{name:"어르신",b:{perf:[13,1.4],pos:[1.5,1.2],vis:[.9,1.1],plan:[3.0,.45]}}],rule:{z:2.3,min:1,trend:true,heat:.19}},
  {id:"S3",title:"2인, 번갈아 운전",kind:"가족",pitch:"누가 운전했는지 자리로 구분",
   occ:["DRIVER","PASSENGER"],modes:{DRIVER:"drive"},
   owners:{DRIVER:[{name:"지수",n:68,t:22.5,fan:2,hv:"열선 1"},{name:"민호",n:55,t:20.5,fan:3,hv:"통풍 2"}],
     PASSENGER:[{name:"민호",n:61,t:21,fan:3,hv:"없음"},{name:"지수",n:49,t:23,fan:2,hv:"열선 1"}]},
   people:[{name:"지수",share:.55,b:{perf:[9.5,.9],pos:[.8,.9],vis:[.3,.4],plan:[3.2,.5]}},{name:"민호",share:.45,b:{perf:[15,1.1],pos:[2,1.4],vis:[.4,.6],plan:[2.4,.5]}}],rule:{z:2,min:1,trend:false,heat:0},auto:true},
  {id:"S4",title:"혼자 출퇴근, 오늘은 동승",kind:"개인",pitch:"옆자리에 탄 사람을 자리가 알아서 구분",
   occ:["DRIVER","PASSENGER"],modes:{DRIVER:"drive"},guestAt:["PASSENGER"],seen:{PASSENGER:2,REAR_LEFT:1},
   owners:{DRIVER:[{name:"서연",n:143,t:22,fan:2,hv:"없음"}]},
   people:[{name:"서연",b:{perf:[11,.8],pos:[.9,.8],vis:[.3,.4],plan:[3.1,.35]}}],rule:{z:2,min:1,trend:false,heat:0}},
];

const MODES = {
  drive: ["운전", -0.5, "바람 유지 · 밝기 유지"],
  rest:  ["휴식", +1.5, "바람 1단 · 조명 10%"],
  focus: ["집중", 0,    "바람 1단 · 조명 80%"],
  "":    ["기본", 0,    ""]
};

const READY = 10;
let liveCo2=false;
let sc=null, modes={}, who=0, tab="rooms", ppm=430, recirc=false, restUntil=0, last=null, sent=null, driving=false, sel="DRIVER", ownerIx={}, ids={}, trendMode={};

let isLight = false;
try { isLight = localStorage.getItem("seatroom.theme") === "light"; } catch(e) {}
function applyTheme(){
  if(isLight) document.documentElement.setAttribute("data-theme", "light-sand");
  else document.documentElement.removeAttribute("data-theme");
}
applyTheme();
document.querySelectorAll("[data-theme-btn]").forEach(b => b.onclick = () => {
  isLight = !isLight; applyTheme();
  try { localStorage.setItem("seatroom.theme", isLight ? "light" : "dark"); } catch(e) {}
});

function person(filled, color, learn) {
  const ring = learn == null ? "" :
    `<circle cx="28" cy="28" r="26" fill="none" stroke="var(--line-subtle)" stroke-width="3"/>
     <circle cx="28" cy="28" r="26" fill="none" stroke="${learn >= 1 ? "var(--c-act-blue)" : "var(--text-dim)"}" stroke-width="3" pathLength="100" stroke-dasharray="${Math.round(learn*100)} 100" transform="rotate(-90 28 28)" stroke-linecap="round"/>`;
  return filled
    ? `<svg viewBox="0 0 56 56" aria-hidden="true">${ring}<circle cx="28" cy="19" r="7.5" fill="${color}"/><rect x="15" y="29" width="26" height="16" rx="8" fill="${color}"/></svg>`
    : `<svg viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="19" r="7.5" fill="none" stroke="var(--text-dim)" stroke-width="2" stroke-dasharray="3.5 3.5"/><rect x="15" y="29" width="26" height="16" rx="8" fill="none" stroke="var(--text-dim)" stroke-width="2" stroke-dasharray="3.5 3.5"/></svg>`;
}

const colorOf = m => m === "rest" ? "#A36B4F" : m === "drive" ? "#00AAD2" : m === "focus" ? "#AACAE6" : "#8b8580";
const word = (m, occ) => occ ? MODES[m || ""][0] : "빈자리";

// 탑승 인식: 사람이 타면 자리가 먼저 알아본다(자동). 같은 사람이면 배운 설정 그대로,
// 다른 사람이면 기본값으로 시작해 새로 배운다. 사람은 판정이 틀렸을 때만 한 번 고친다(fix).
// 운전석은 평소의 나(좌석 위치로 운전자 구분)가 맡으므로 여기서 다루지 않는다.
// live: 차 신호로 탄 사람 → 첫 설정 온도·좌석 이동·탑승 횟수를 차에서 받아 채운다(처음엔 비어 있음)
const jong = s => { const c = s.charCodeAt(s.length - 1) - 0xAC00; return c >= 0 && c <= 11171 ? c % 28 : 0; };
const ro = s => s + (jong(s) === 0 || jong(s) === 8 ? "로" : "으로");
const iga = s => s + (jong(s) ? "이" : "가");
const yeyo = s => s + (jong(s) ? "이에요" : "예요");

const ownerOf = k => { const o = sc.owners[k]; return o ? o[ownerIx[k] || 0] : null; };
const family = () => { const seen = new Set(); return Object.values(sc.owners).flat().filter(p => !seen.has(p.name) && seen.add(p.name)); };
// 잘못 인식되는 예에 쓸 가족: 이 자리 주인이 아닌 사람
const otherFamily = k => family().filter(p => p.name !== (ownerOf(k) || {}).name);
const newcomer = t => ({name: "새 탑승자", n: 1, t: t ?? 22, fan: 2, hv: "없음"});
// 첫 설정 온도와 가장 가까운 가족(학습된 선호 온도 기준)
const nearOf = t => Object.values(sc.owners).flat().reduce((a,p) => !a || Math.abs(p.t - t) < Math.abs(a.t - t) ? p : a, null);
function farTemp(){
  const known = Object.values(sc.owners).flat();
  return [26, 19.5, 25.5, 20].map(v => [v, Math.min(...known.map(p => Math.abs(p.t - v)))]).sort((a,b) => b[1] - a[1])[0][0];
}

// kind: same = 평소 그 사람 / new = 처음 보는 사람 / wrong = 가족인데 평소와 달라 잘못 인식되는 예
function seatId(k, live, kind){
  const o = ownerOf(k), d = {live: !!live, kind: kind || "new", t: null, moved: false, movedBy: 0, seen: (sc.seen && sc.seen[k]) || 0, seenLive: 0, fix: null, example: null};
  if(live) return d;
  if(d.kind === "same" && o) d.t = o.t;
  else if(d.kind === "wrong" && otherFamily(k).length){
    const f = otherFamily(k)[0];
    const known = Object.values(sc.owners).flat();
    d.t = [f.t - 2, f.t + 2, f.t - 2.5, f.t + 2.5, f.t - 3, f.t + 3].map(v => [v, Math.min(...known.map(q => Math.abs(q.t - v)))]).sort((a, b) => b[1] - a[1])[0][0];
    d.moved = true;
    d.example = {name: f.name, text: `예시 · ${iga(f.name)} 두꺼운 외투를 입고 앉아 시트를 뒤로 밀고, 온도를 평소(${f.t.toFixed(1)}°)와 다른 ${d.t.toFixed(1)}°로 맞췄어요.`};
  } else { d.kind = "new"; d.t = farTemp(); d.moved = true; }
  return d;
}
function board(k, live, kind){
  if(!sc.occ.includes(k)) sc.occ.push(k);
  if(!liveCo2) ppm += 40;
  if(k !== "DRIVER") ids[k] = seatId(k, live, kind);
}

const SHORT = {new: "새 탑승자", guest: "손님", pending: "확인 중"};
const vName = j => j.v === "owner" || j.v === "known" ? j.who.name : j.v === "new" ? "처음 보는 분" : SHORT[j.v];

// 자동 판정. 근거마다 s: true = 평소(그 사람)와 같음, false = 다름, null = 아직 모름
function autoJudge(k){
  const d = ids[k], o = ownerOf(k);
  if(o){
    const tSame = d.t == null ? null : Math.abs(d.t - o.t) <= 1;
    const c = [
      {s: !d.moved, a: `앉은 뒤 시트 위치 <b>&nbsp;${d.moved ? "옮김" : "평소 그대로"}</b>`, b: `${o.name} 평소 위치와 비교${d.live && d.movedBy ? ` · 위치 값 ${d.movedBy} 변화` : ""}`},
      {s: tSame, a: d.t == null ? `처음 맞춘 온도 <b>&nbsp;아직 없음</b>` : `처음 맞춘 온도 <b>&nbsp;${d.t.toFixed(1)}°</b>`, b: `${o.name} 평소 ${o.t.toFixed(1)}° · ±1° 안이면 같음`},
    ];
    const miss = c.filter(x => x.s === false).length;
    return miss >= 2 ? {v: "new", who: newcomer(d.t), c} : {v: "owner", who: o, c, unsure: miss === 1};
  }
  const seen = d.seen + d.seenLive, near = d.t == null ? null : nearOf(d.t);
  const c = [
    {s: seen >= READY / 2, a: `최근 30일 이 자리 이용 <b>&nbsp;${seen}회</b>`, b: `${d.live ? `가상 ${d.seen} + 실제 ${d.seenLive} · ` : ""}5회 이상이면 자주 타는 사람`},
    {s: near ? Math.abs(d.t - near.t) <= 0.5 : null, a: d.t == null ? `처음 맞춘 온도 <b>&nbsp;아직 없음</b>` : `처음 맞춘 온도 <b>&nbsp;${d.t.toFixed(1)}°</b>`, b: near ? `가장 가까운 ${near.name} ${near.t.toFixed(1)}° · ±0.5° 안이면 같음` : "직접 맞추면 가족과 비교"},
    {s: !d.moved, a: `앉은 뒤 시트 위치 <b>&nbsp;${d.moved ? "옮김" : "그대로"}</b>`, b: `체형이 다르면 옮겨요${d.live && d.movedBy ? ` · 위치 값 ${d.movedBy} 변화` : ""}`},
  ];
  if(near && c[1].s && !d.moved) return {v: "known", who: near, c};
  return c.filter(x => x.s === false).length >= 2 ? {v: "new", who: newcomer(d.t), c} : {v: "pending", who: null, c};
}
function judge(k){
  if(k === "DRIVER" || !ids[k]) return null;
  const a = autoJudge(k), f = ids[k].fix;
  return f ? {...a, ...f, unsure: false, by: "person", from: a} : {...a, by: "auto"};
}
const isGuest = k => judge(k)?.v === "guest";
// 지금 이 자리가 맞춰 주는 사람(인식 결과). 손님·확인 중이면 없음 → 공장값
const personOf = k => { const j = judge(k); return j ? j.who : ownerOf(k); };
// 자리가 배운 사람: 10회 이상 탄 사람. 그 전에는 공장값(22°·2단)
const learned = k => { const p = personOf(k); return p && p.n >= READY ? p : null; };
const fanOf = (k, m) => m === "rest" || m === "focus" ? 1 : (learned(k)?.fan ?? 2);
const tempOf = (k, m) => { const o = learned(k); return (o ? o.t : 22) + MODES[m || ""][1]; };
// 차에 지금 실제로 설정된 온도(차 신호가 있을 때만)
const carTemp = k => car && car.setTemp && car.setTemp[k] != null ? car.setTemp[k] : null;

function carHTML(s, mini){
  const rows = [[0,1],[2,3]].map(r => `<div class="row">${r.map(i => {
    const [k, l] = SEATS[i], m = (mini ? s.modes[k] : modes[k]) || "", occ = s.occ.includes(k);
    if(mini) return `<div class="seat ${m}">${person(occ, colorOf(m))}</div>`;
    const o = ownerOf(k), j = occ ? judge(k) : null, p = occ ? personOf(k) : null;
    const odd = j && j.v !== "owner" && j.v !== "known";
    const who = !occ ? (o ? `<span class="dim">${o.name}</span>` : "&nbsp;") : j ? (odd ? SHORT[j.v] : p.name) : (o ? o.name : "&nbsp;");
    return `<button class="seat ${m} ${sel === k ? "sel" : ""}" data-seat="${k}" aria-pressed="${sel === k}" aria-label="${l} ${occ ? (j ? (odd ? SHORT[j.v] : p.name) : o ? o.name : "") : "빈자리"} ${word(m, occ)}">
      <span class="lb">${l}</span>
      <span class="ow" ${odd ? 'style="color:var(--c-h-gold)"' : ""}>${who}</span>
      ${person(occ, colorOf(m), p && occ ? Math.min(1, p.n / READY) : null)}
      <span class="md">${word(m, occ)}</span>
      <span class="tp">${occ ? (carTemp(k) ?? tempOf(k, m)).toFixed(1) + "°" : `<span class="dim">${(o && o.n >= READY ? o.t : 22).toFixed(1)}°</span>`}</span>
    </button>`;
  }).join("")}</div>`).join("");
  return (mini ? "" : `<div class="front">앞</div>`) + rows + (mini ? "" : `<div class="hint">좌석 터치 시 맞춤 내역 확인</div>`);
}

function renderPick(){
  $("pick").innerHTML = SC.map((s, i) => `<button class="card" data-i="${i}">
    <div class="mini"><div class="car">${carHTML(s, true)}</div></div>
    <div class="n">${s.title}</div>
    <div class="k">${s.kind} 환경</div>
    <div class="p">${s.pitch}</div>
  </button>`).join("");
  $("pick").querySelectorAll(".card").forEach(b => b.onclick = () => choose(+b.dataset.i));
}

function choose(i){
  sc = {...SC[i], occ:[...SC[i].occ], owners:{...SC[i].owners}};
  modes = {...sc.modes}; who = 0; sel = "DRIVER"; ownerIx = {}; ids = {}; last = null;
  // 처음부터 탄 가족은 평소 그 사람으로 인식된 상태
  sc.occ.filter(k => k !== "DRIVER" && ownerOf(k)).forEach(k => ids[k] = seatId(k, false, "same"));
  (sc.guestAt || []).forEach(k => { board(k); sel = k; });
  sent = null; tab = "rooms";
  if(!liveCo2) ppm = 420 + sc.occ.length * 40;

}

function rng(str){
  let h = 1779033703;
  for(const c of str) h = Math.imul(h ^ c.charCodeAt(0), 3432918353);
  return () => {
    h = Math.imul(h ^ h >>> 16, 2246822507);
    h = Math.imul(h ^ h >>> 13, 3266489909);
    return ((h ^= h >>> 16) >>> 0) / 4294967296;
  };
}

function history(o){
  const r = rng(o.name + o.t), g = () => { let s = 0; for(let i = 0; i < 6; i++) s += r(); return s - 3; };
  const out = [], seen = [];
  for(let i = 0; i < o.n; i++){
    const settled = Math.round((o.t + g() * 0.3) * 2) / 2;
    const fan = r() < 0.12 ? o.fan + (r() < 0.5 ? -1 : 1) : o.fan;
    const ready = i >= READY;
    const learnedT = ready ? Math.round(seen.reduce((a,b) => a+b, 0) / seen.length * 2) / 2 : 22;
    const fixes = Math.min(3, Math.abs(settled - learnedT) / 0.5) + (fan !== (ready ? o.fan : 2) ? 1 : 0) + ((ready || o.hv === "없음") ? 0 : 1);
    out.push({fixes, ready, settled, learnedT, tempOff: Math.abs(settled - learnedT) >= 0.5, fanOff: fan !== (ready ? o.fan : 2)});
    seen.push(settled);
  }
  return out;
}

function idStrip(j){
  const n = vName(j);
  const head = j.by === "person" ? `자동 판정 '${vName(j.from)}' → 사람이 '${n}'${jong(n) === 0 || jong(n) === 8 ? "로" : "으로"} 고침`
    : j.v === "owner" ? (j.unsure ? `아마 ${j.who.name} · 한 가지가 평소와 달라요` : `평소 앉는 ${ro(j.who.name)} 알아봤어요`)
    : j.v === "known" ? `${ro(j.who.name)} 알아봤어요 · 평소엔 다른 자리`
    : j.v === "new" ? "평소 앉던 사람과 달라 새로 배우기 시작했어요"
    : j.v === "guest" ? "손님 · 이번 탑승만 기본값" : "누가 탔는지 살펴보는 중";
  const note = j.v === "owner" || j.v === "known" ? `${j.who.name} 설정으로 맞췄어요` : j.v === "new" ? `기본값으로 시작 · ${READY}번 타면 자리가 먼저 맞춰요`
    : j.v === "guest" ? "기록하지 않고 내리면 지워요" : "지금은 기본값 · 온도를 맞추면 판단해요";
  return `<div class="id-strip"><span class="tag ${j.by}">${j.by === "person" ? "사람이 고침" : "자동 인식"}</span><span class="tx">${head}<small>${note}${j.by === "person" ? " · 다음 판정부터 반영" : ""}</small></span></div>`;
}
// 틀렸을 때만 누르는 고침 버튼
function fixHTML(k, j){
  const d = ids[k], chips = [];
  if(j.v === "owner" || j.v === "known") chips.push(`<button class="chip sm" data-fix="new">다른 사람이에요</button>`);

    chips.push(`<button class="chip sm ${d.example && d.example.name === p.name && j.by === "auto" ? "hint" : ""}" data-fix="known" data-who="${p.name}">${yeyo(p.name)}</button>`));

}

function renderLearn(){
  const L = $("learn"), [, label] = SEATS.find(s => s[0] === sel), occ = sc.occ.includes(sel), o = occ ? personOf(sel) : ownerOf(sel), m = modes[sel] || "";
  const opts = sel === "DRIVER" ? ["drive", "rest"] : ["", "rest", "focus"];
  const seg = occ ? `<div class="seg" role="group" aria-label="방 모드">${opts.map(x => `<button data-m="${x}" aria-pressed="${m === x}">${MODES[x][0]}</button>`).join("")}</div>` : "";
  const two = sc.owners[sel] && sc.owners[sel].length > 1
    ? sc.owners[sel].map((p,i) => `<button class="chip" aria-pressed="${(ownerIx[sel]||0)===i}" data-o="${i}">${p.name}</button>`).join(" ") : "";

  const j = occ ? judge(sel) : null, d = ids[sel];
  let body, title = o && occ ? o.name + "의 맞춤 공간" : "빈자리";

  if(!occ){
    const ex = otherFamily(sel)[0], lo = o && o.n >= READY ? o : null, seen = (sc.seen && sc.seen[sel]) || 0;
    const step = (n, a, b) => `<div><i class="step">${n}</i>${a}<span>${b}</span></div>`;
    title = o ? `빈자리 · 주로 ${o.name}` : "빈자리 · 누가 타면 자리가 알아봐요";
    body = `
      <div class="why">
        ${step(1, `타자마자 <b>&nbsp;${lo ? `${lo.name} 설정 ${lo.t.toFixed(1)}° · ${lo.fan}단 · ${lo.hv}` : "기본값 22.0° · 2단 · 시트 없음"}</b>`, "내기 순환이면 CO₂ 추정이 1분에 약 70ppm 더 올라요")}
        ${step(2, `자리가 알아봐요 <b>&nbsp;자동</b>`, o ? `시트 위치·처음 맞춘 온도를 ${o.name} 평소와 비교` : `최근 30일 이용 ${seen}회 · 처음 맞춘 온도 · 시트 이동`)}
        ${step(3, `같은 사람이면 <b>&nbsp;배운 설정 그대로</b>`, `다른 사람이면 기본값으로 시작해 새로 배워요 (${READY}회)`)}
        ${step(4, `사람은 <b>&nbsp;틀렸을 때만</b>&nbsp;한 번 고쳐요`, `"다른 사람이에요" · "${ex ? yeyo(ex.name) : "손님이에요"}"`)}
      </div>
      <div class="acts"><span class="q">가상 탑승</span>
        ${sel === "DRIVER" ? `<button class="btn line" data-board="same">타기</button>` : `

  } else if(j && (j.v === "new" || j.v === "guest" || j.v === "pending")){
    title = j.v === "new" ? "처음 보는 분 · 새로 배우는 중" : j.v === "guest" ? "손님 맞춤 공간" : "누가 탔는지 알아보는 중";
    const n = j.v === "new" ? j.who.n : 0;
    body = `${lines}${ev(j.c)}
      <div class="today-grid">
        <div class="today-item"><div class="val">${tempOf(sel, m).toFixed(1)}°</div><div class="lbl">${j.v === "guest" ? "임시 설정" : "기본값으로 시작"}</div></div>

      </div>

  } else if(!o){
    const seen = (sc.seen && sc.seen[sel]) || 0;
    body = `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text-dim);text-align:center;">
      ${person(false)}
      <div style="font-size:clamp(14px, 1.4cqw, 17px)">최근 30일간 탑승 기록 적음 (${seen}회)</div>
    </div>`;
  } else {
    const ready = o.n >= READY;
    // 배우기 전(10회 미만)에는 차가 공장값(22°·2단·시트 없음)을 준다
    const curTemp = tempOf(sel, m), curFan = fanOf(sel, m);
    const curSeat = ready ? o.hv : "없음";

    // 확신도: 최근 10회 탑승에서 배운 값을 그대로 쓴 비율(온도는 ±0.5° 안)
    const hist = history(o), recent = hist.slice(-10), rn = Math.max(1, recent.length);
    const tIn = recent.filter(d => Math.abs(d.settled - o.t) <= 0.5).length;
    const fIn = recent.filter(d => !d.fanOff).length;
    const sIn = recent.filter(d => d.ready || o.hv === "없음").length;
    const pct = k => Math.round(k / rn * 100);
    const confRate = ready ? Math.round((pct(tIn) + pct(fIn) + pct(sIn)) / 3) : Math.round(o.n / READY * 100);
    const tempStability = ready ? `최근 10회 중 ${tIn}회 ±0.5°` : `평균 · 모으는 중 ${o.n}/${READY}회`;

    // 1. 오늘 자리가 먼저 맞춘 것 (실시간 자동 적용 카드)
    const todayActionHTML = `
      <div class="today-card">
        <div class="today-header">
          <span class="today-tag">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor">
              <path d="M8 0a8 8 0 1 0 8 8A8.01 8.01 0 0 0 8 0zm3.7 6.3-4.5 4.5a.75.75 0 0 1-1.06 0L4.3 9a.75.75 0 0 1 1.06-1.06l1.24 1.25 3.97-3.97a.75.75 0 1 1 1.06 1.06z"/>
            </svg>
            ${ready ? "오늘 탑승 시 자동 맞춤" : `오늘은 기본값 (학습 ${o.n}/${READY}회)`}
          </span>
          ${fixesNow === 0
            ? `<span class="status-badge">
                 <svg viewBox="0 0 12 12" width="11" height="11" fill="currentColor"><path d="M10.3 3.3 4.5 9.1 1.7 6.3l1-1 1.8 1.8 4.8-4.8z"/></svg>
                 손대지 않고 유지 중
               </span>`
            : `<span class="status-badge modified">
                 수동 조정 ${fixesNow}회 (학습 반영)
               </span>`
          }
        </div>
        <div class="today-grid">
          <div class="today-item">
            <div class="val">${curTemp.toFixed(1)}°</div>
            <div class="lbl">${m ? MODES[m][0] + " 맞춤" : "공조 온도"}${carTemp(sel) != null && Math.abs(carTemp(sel) - curTemp) >= 0.5 ? ` · 지금 ${carTemp(sel).toFixed(1)}°` : ""}</div>
          </div>
          <div class="today-item">
            <div class="val">${curFan}단</div>
            <div class="lbl">선호 풍량</div>
          </div>
          <div class="today-item">
            <div class="val">${curSeat}</div>
            <div class="lbl">시트 모드</div>
          </div>
        </div>
      </div>
    `;

    // 2. 이 자리가 아는 나 (Preference & Confidence Card) - 게이지 두께 및 높이 확장
    const prefIntelHTML = `
      <div class="pref-intel-card">
        <div class="pref-intel-header">
          <span class="pref-intel-title">${j && j.v === "known" ? "오늘 이 자리는" : "이자리는 우리"} <span class="owner-name">${o.name}</span></span>
          <span class="confidence-score">
            ${ready ? `확신도 <strong>${confRate}%</strong> (최근 10회 기준)` : `학습 <strong>${confRate}%</strong> (${o.n}/${READY}회)`}
          </span>
        </div>
        <div class="intel-rows">
          <div class="intel-row">
            <span class="intel-label">선호 온도</span>
            <div class="intel-bar-wrap">
              <div class="intel-bar-fill" style="width:${ready ? pct(tIn) : confRate}%"></div>
            </div>
            <span class="intel-stat">${o.t.toFixed(1)}° · ${tempStability}</span>
          </div>
          <div class="intel-row">
            <span class="intel-label">선호 바람</span>
            <div class="intel-bar-wrap">
              <div class="intel-bar-fill" style="width:${ready ? pct(fIn) : confRate}%"></div>
            </div>
            <span class="intel-stat">${o.fan}단 · ${ready ? `최근 10회 중 ${fIn}회 그대로` : "모으는 중"}</span>
          </div>
          <div class="intel-row">
            <span class="intel-label">시트 습관</span>
            <div class="intel-bar-wrap">
              <div class="intel-bar-fill" style="width:${ready ? pct(sIn) : confRate}%"></div>
            </div>
            <span class="intel-stat">${o.hv} · ${ready ? `최근 10회 중 ${sIn}회 그대로` : "모으는 중"}</span>
          </div>
        </div>
      </div>
    `;

    // 3. 직접 고친 횟수 근거 (한 줄 컴팩트 캡슐)
    const h = hist;
    const avg = a => a.reduce((s,d) => s + d.fixes, 0) / Math.max(1, a.length);
    const early = avg(h.slice(0, READY));
    const late = avg(h.slice(-10));

    const impactHTML = `
      <div class="impact-pill">
        <span>자리가 먼저 맞추면서 <strong>직접 고친 횟수</strong></span>
        <span>${ready
          ? `처음 <strong>${early.toFixed(1)}회</strong> → 최근 <span class="highlight">${late.toFixed(1)}회</span>${late < early ? "로 감소" : ""}`
          : `학습 중 <strong>${o.n}/${READY}회</strong> · 10회부터 자리가 먼저 맞춰요`}
        </span>
      </div>
    `;

    body = (j ? lines + fixHTML(sel, j) : "") + todayActionHTML + prefIntelHTML + (j ? "" : impactHTML);
  }

  L.innerHTML = `<div class="lh"><div><div class="sl">${label}${sc.auto && two ? " · 자리 위치 인식" : ""}</div><div class="nm">${title}</div></div>${two}<span class="sp"></span>${seg}</div>${body}`;
  L.querySelectorAll(".seg button").forEach(b => b.onclick = () => { modes[sel] = b.dataset.m; toCar("setMode", sel, modes[sel], tempOf(sel, modes[sel]), fanOf(sel, modes[sel])); renderRooms(); });
  L.querySelectorAll("[data-board]").forEach(b => b.onclick = () => { board(sel, false, b.dataset.board); renderRooms(); });
  // 사람이 고치는 것은 판정이 틀렸을 때 한 번뿐. 고친 값으로 바로 다시 맞춘다.

    d.fix = f === "auto" ? null : f === "guest" ? {v: "guest", who: null} : f === "new" ? {v: "new", who: newcomer(d.t)} : {v: "known", who: family().find(p => p.name === b.dataset.who)};
    if(modes[sel]) toCar("setMode", sel, modes[sel], tempOf(sel, modes[sel]), fanOf(sel, modes[sel]));
    renderRooms();
  });
  L.querySelectorAll(".chip[data-o]").forEach(b => b.onclick = () => { ownerIx[sel] = +b.dataset.o; if(sc.auto){ const other = sel === "DRIVER" ? "PASSENGER" : "DRIVER"; ownerIx[other] = 1 - ownerIx[sel]; Object.entries(ids).forEach(([x, e]) => { if(!e.live && e.kind === "same" && ownerOf(x)) e.t = ownerOf(x).t; }); const d = ownerOf("DRIVER").name; who = Math.max(0, sc.people.findIndex(x => x.name === d)); syncDriver(); } renderRooms(); });
}

}

function gauss(){
  let u = 0, v = 0;
  while(!u) u = Math.random();
  while(!v) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

  const people = sc.people;
  $("whoBox").innerHTML = people.length > 1
    ? people.map((p,i) => `<button class="chip" aria-pressed="${i===who}" data-i="${i}">${p.name}</button>`).join(" ")

    return `<div class="ax ${ch ? "changed" : ""}"><div class="n">${a.n} 축</div>
      <svg viewBox="0 0 200 40" preserveAspectRatio="none" aria-hidden="true">
        <line x1="4" y1="20" x2="196" y2="20" stroke="var(--line-subtle)" stroke-width="6" stroke-linecap="round"/>
        <line x1="${X(m - z * sd)}" y1="20" x2="${X(m + z * sd)}" y2="20" stroke="var(--c-act-blue)" stroke-opacity=".35" stroke-width="12" stroke-linecap="round"/>
        <line x1="100" y1="8" x2="100" y2="32" stroke="var(--text-dim)" stroke-width="2.5"/>
        ${today == null ? "" : `<circle cx="${X(today)}" cy="20" r="7.5" fill="${col}"/>`}
      </svg>
      <div class="st" style="color:${col}">${today == null ? "—" : ch ? "평소와 다름" : "평소 범위"}</div>
      <div class="q">${a.q}${base[a.k].real ? " · 실제 기준" : ""}</div></div>`;
  }).join("");

  const al = $("alert");
  const bell = f => `<svg viewBox="0 0 34 34" aria-hidden="true"><path d="M7 24.5C8.5 20.4 7.5 6 17 5.1 26.5 6 25.5 20.4 27 24.5Z" fill="${f ? "var(--c-h-gold)" : "none"}" stroke="${f ? "var(--c-h-gold)" : "var(--text-dim)"}" stroke-width="2.4"/><circle cx="17" cy="28.5" r="2.7" fill="${f ? "var(--c-h-gold)" : "var(--text-dim)"}"/></svg>`;
  const opts = [["평소 패턴",0],["1축 변동",1],["복합 다축 변동",2]]
    .map(([t,k]) => `<button data-k="${k}" aria-pressed="${last && last.kind === k}">${t}</button>`).join("");

  $("ruleBox").textContent = "알림 기준: " + ruleText() + " · " + baseText(base);

  if(!last){
    al.className = "alert";
    al.innerHTML = `<div class="h">${bell(false)}오늘 운전은 어땠나요?</div><div class="opts big">${opts}</div>`;
  } else {
    const lines = advice(last.v, last.base).concat(last.heat ? [{n: "열 감각", text: HEAT_ADVICE}] : []);
    const msgs = lines.length ? `<div class="msgs">${lines.map(l => `<div class="msg ${last.sent ? "" : "dim"}"><span class="tg w">${l.n}</span>${l.text}</div>`).join("")}</div>` : "";
    const whoTag = sc.auto ? `<span class="tg c">${p.name} 인식됨</span>` : "";
    const title = (last.kind === "live" ? "실제 주행 동기화 · " : "") + (last.sent ? "맞춤 케어 알림 전송" : last.changed.length ? "경미한 변동 · 알림 안 함" : "이상 없음 · 평소 범위 내");
    const why = last.sent ? (last.changed.length >= sc.rule.min ? `${last.changed.length}개 축 동시 변동 (기준 ${sc.rule.min}개)` : last.kind === "live" ? "더운데 10분 넘게 조작 없음" : "더위 무반응")
      : last.changed.length ? `${last.changed.length}개 축 변동 < 기준 ${sc.rule.min}개 → 리포트에만 기록` : "";
    al.className = "alert " + (last.sent ? "sent" : "calm");
    al.innerHTML = `<div class="h">${bell(last.sent)}${title}${whoTag ? `<span class="tags">${whoTag}</span>` : ""}</div>${msgs}<div class="f">${why}</div><div class="opts">${opts}</div>`;
  }
  al.querySelectorAll(".opts button").forEach(b => b.onclick = () => simulate(+b.dataset.k));

  const tr = $("trend"), tk = sc.id + p.name, tm = trendMode[tk] ?? (sc.rule.trend ? "drift" : "steady");
  const wk = weekly(p, tm), ax = AX[3], [m, sd0] = p.b.plan, sd = Math.max(ax.min, sd0) * 0.5;
  const lo = m - 4 * sd, hi = m + 2.2 * sd, W = 200, H = 60, X = i => 8 + i * (W - 16) / (wk.length - 1), Y = v => H - 4 - (Math.min(hi, Math.max(lo, v)) - lo) / (hi - lo) * (H - 8);
  const drift = tm === "drift";

  tr.innerHTML = `<div class="t">중장기 추세 모니터링</div>
    <div class="v" style="color:${drift ? "var(--c-h-gold)" : "var(--c-act-blue)"}">${drift ? "↘ 계획 축 간격 감소" : "8주간 일정한 패턴 유지"}</div>
    ${drift ? `<div class="msg" style="margin-bottom:2px">깜빡이를 켜는 때가 몇 주째 조금씩 늦어져요</div>` : ""}
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="최근 8주 계획 축 주별 평균">
      <rect x="4" y="${Y(m + sd)}" width="${W - 8}" height="${Y(m - sd) - Y(m + sd)}" fill="var(--c-act-blue)" opacity=".15" rx="3"/>
      <polyline points="${wk.map((v,i) => `${X(i)},${Y(v)}`).join(" ")}" fill="none" stroke="var(--text-dim)" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
      ${wk.map((v,i) => `<circle cx="${X(i)}" cy="${Y(v)}" r="2.8" fill="${i >= 4 && drift ? "var(--c-h-gold)" : "var(--text-dim)"}"/>`).join("")}
    </svg>
    <div style="color:var(--text-dim);font-size:11px">8주 데이터 (${drift ? (sc.rule.trend ? "알림 발송 대상" : "리포트 누적 기록") : "정상 범위 유지"})</div>
    <div class="opts"><button data-t="steady" aria-pressed="${!drift}">변화 없음</button><button data-t="drift" aria-pressed="${drift}">서서히 변함</button></div>`;
  tr.querySelectorAll(".opts button").forEach(b => b.onclick = () => { trendMode[tk] = b.dataset.t; if(b.dataset.t === "drift" && sc.rule.trend) toCar("notify", "trend", "몇 주째 조금씩 달라지고 있어요", "깜빡이를 켜는 때가 몇 주째 조금씩 늦어져요"); renderMe(); });
}

// 축마다 비교 기준 {m, sd, real, n}. live = 차가 보낸 지난 실제 주행 기준선(이번 주행 제외)
function baseOf(p, live){
  const out = {};
  AX.forEach(a => {
    const [m0, sd0] = p.b[a.k], lb = live && live[a.k];
    out[a.k] = lb && lb.n >= READY && lb.m != null
      ? {m: lb.m, sd: Math.max(a.min, lb.sd ?? 0), real: true, n: lb.n}
      : {m: m0, sd: Math.max(a.min, sd0), real: false, n: lb ? lb.n : 0};
  });
  return out;
}
const changedAxes = (v, base) => AX.filter(a => v[a.k] != null && Math.abs((v[a.k] - base[a.k].m) / base[a.k].sd) >= sc.rule.z).map(a => a.n);
function baseText(base){
  const n = base.pos.n, real = AX.filter(a => base[a.k].real).length;
  return real === 4 ? `기준선: 실제 주행 ${n}회` : real ? `기준선: 실제 ${real}축 · 시나리오 ${4 - real}축` : `기준선: 시나리오 값${n ? ` (실제 ${n}/${READY}회)` : ""}`;
}
function syncDriver(){ if(sc) toCar("setDriver", sc.id + ":" + sc.people[who].name); }

const ADVICE = {
  perf: ["핸들을 자주 고쳐 잡았어요 · 피곤하면 쉬어 가세요", "핸들 조작이 적었어요 · 주의가 흐려지지 않게"],
  pos:  ["자세를 자주 고쳤어요 · 허리·목을 살펴보세요", "자세를 거의 안 바꿨어요 · 오래 타면 쉬어 가세요"],
  vis:  ["상향등을 오래 켰어요 · 밤길이 잘 안 보였나요?", "상향등을 덜 썼어요"],
  plan: ["깜빡이 뒤 핸들까지 길었어요", "깜빡이를 늦게 켰어요 · 차선 바꿀 때 여유 있게"],
};
const HEAT_ADVICE = "더운데 공조를 안 바꿨어요 · 온도를 확인하세요";

function advice(v, base){
  return AX.filter(a => v[a.k] != null).map(a => {
    const {m, sd} = base[a.k], z = (v[a.k] - m) / sd;
    return Math.abs(z) >= sc.rule.z ? {n: a.n, text: ADVICE[a.k][z > 0 ? 0 : 1]} : null;
  }).filter(Boolean);
}

function weekly(p, mode){
  const r = rng(p.name + mode), [m, sd0] = p.b.plan, sd = Math.max(0.4, sd0);
  return Array.from({length: 8}, (_, i) => m + (r() - 0.5) * sd * 0.5 - (mode === "drift" && i >= 4 ? (i - 3) * sd * 0.45 : 0));
}

function ruleText(){
  const r = sc.rule;
  return (r.min > 1 ? `${r.min}개 축 이상` : `1개 축부터`) + (r.heat ? " · 더위 무반응" : "") + (r.trend ? " · 중장기 추세" : "");
}

function simulate(kind){
  if(sc.auto){ who = Math.random() < sc.people[0].share ? 0 : 1; ownerIx = {DRIVER: who, PASSENGER: 1 - who}; syncDriver(); }
  const p = sc.people[who], v = {}, base = baseOf(p, null);
  const shift = {perf: 3.4, pos: 4, vis: 4.5, plan: -3.4}, one = AX[Math.floor(Math.random() * 4)].k;
  AX.forEach(a => {
    const [m, sd0] = p.b[a.k], sd = Math.max(a.min, sd0), moved = kind === 2 || (kind === 1 && a.k === one);
    v[a.k] = m + sd * (moved ? shift[a.k] + gauss() * 0.4 : gauss() * 0.6);
    if(a.k !== "plan") v[a.k] = Math.max(0, v[a.k]);
  });
  const changed = changedAxes(v, base);
  const heat = sc.rule.heat > 0 && kind === 2;
  last = {kind, v, base, changed, heat, sent: changed.length >= sc.rule.min || heat};
  if(last.sent) toCar("notify", "today", "오늘 운전이 평소와 조금 달랐어요", advice(v, base).map(l => l.text).concat(heat ? [HEAT_ADVICE] : []).join('\n'));
  renderMe();
}

function renderDrive(){
  if(sc && modes.DRIVER === "rest") modes.DRIVER = "drive";
  const sleeping = sc ? Object.entries(modes).filter(([k,m]) => m === "rest" && k !== "DRIVER" && sc.occ.includes(k)).length : 0;
  const high = ppm >= 1500, rest = Date.now() < restUntil;
  const t = (c, b, s) => `<div class="big3" style="border-color:${c}"><b>${b}</b>${s ? `<span>${s}</span>` : ""}</div>`;
  $("drive").innerHTML = t(sleeping ? "var(--c-h-gold)" : "var(--line-subtle)", sleeping ? `${sleeping}명 휴식 중` : "휴식 없음", sleeping ? "부드러운 주행 제어 중" : "")
    + t(high ? "var(--c-act-red)" : "var(--c-act-blue)", high ? "실내 환기 필요" : "공기 쾌적", "")
    + t(rest ? "var(--c-act-red)" : "var(--line-subtle)", rest ? "휴식 및 정차 권장" : "주행 컨디션 양호", "");
  $("freshD").hidden = !(high && recirc);
}

// 축마다 평소와 다를 때 읽는 법: [짧은 이름, 오늘 상태, 살필 점]. 진단하지 않고 조작 사실과 권유만.
const STATE = {
  perf: [["핸들 보정 잦음", "핸들을 평소보다 자주 고쳐 잡았어요", "피곤하거나 주의가 흐트러졌을 수 있어요"],
         ["핸들 조작 적음", "핸들 조작이 평소보다 적었어요", "주의가 덜 기울었을 수 있어요"]],
  pos:  [["자세 자주 고침", "자세를 평소보다 자주 고쳤어요", "허리·목이 불편했을 수 있어요"],
         ["자세 굳음", "자세를 평소보다 거의 안 바꿨어요", "오래 운전할 땐 쉬어 가세요"]],
  vis:  [["상향등 오래 씀", "상향등을 평소보다 오래 켰어요", "밤길이 잘 안 보였을 수 있어요"],
         ["상향등 덜 씀", "상향등을 평소보다 덜 썼어요", ""]],
  plan: [["조향 망설임", "깜빡이 뒤 핸들까지 평소보다 오래 걸렸어요", "판단이 망설여졌을 수 있어요"],
         ["반응이 늦음", "깜빡이를 평소보다 늦게 켰어요", "평소보다 반응이 늦어요 · 차선 바꿀 때 여유를 두세요"]],
};
const fmt = (k, v) => k === "pos" ? `${Math.round(v)}회` : `${v.toFixed(1)}${AX.find(a => a.k === k).u}`;
const LV = {warn: "주의 필요", look: "살펴볼 점", ok: "평소대로"};

// 운전자: 오늘(평소의 나 대비) + 몇 주 추세(8주)를 함께 읽는다
function driverReport(p){
  const tk = sc.id + p.name, drift = (trendMode[tk] ?? (sc.rule.trend ? "drift" : "steady")) === "drift";
  const wk = weekly(p, drift ? "drift" : "steady"), avg = a => a.reduce((x, y) => x + y, 0) / a.length;
  const before = avg(wk.slice(0, 4)), after = avg(wk.slice(4));
  const lines = [];
  let diffs = [];
  if(last){
    diffs = AX.filter(a => last.v[a.k] != null).map(a => {
      const {m, sd} = last.base[a.k], z = (last.v[a.k] - m) / sd;
      return Math.abs(z) >= sc.rule.z ? {k: a.k, n: a.n, lo: z < 0, today: last.v[a.k], m} : null;
    }).filter(Boolean);
    diffs.forEach(d => { const [, what, hint] = STATE[d.k][d.lo ? 1 : 0];
      lines.push({t: what, d: `${d.n} · 오늘 ${fmt(d.k, d.today)} / 평소 ${fmt(d.k, d.m)}${hint ? " · " + hint : ""}`}); });
    if(last.heat) lines.push({t: "더운데 공조를 안 바꿨어요", d: "열 감각 · 실내 온도를 확인하세요"});
    const same = AX.filter(a => last.v[a.k] != null && !diffs.some(d => d.k === a.k)).map(a => a.n);
    if(same.length) lines.push({t: `${same.join("·")}은 평소 범위예요`, d: ""});
  }
  // 추세와 오늘이 같은 방향이면 일시적이 아닐 수 있다
  const planLate = diffs.find(d => d.k === "plan" && d.lo);
  const trend = drift
    ? {t: "깜빡이를 켜는 때가 몇 주째 늦어지고 있어요", d: `계획 축 · 이전 4주 ${before.toFixed(1)}초 → 최근 4주 ${after.toFixed(1)}초${planLate ? " · 오늘 변화도 같은 방향이라 일시적이 아닐 수 있어요" : ""}`}
    : {t: "8주 동안 운전 패턴이 일정해요", d: `계획 축 · 주별 평균 ${Math.min(...wk).toFixed(1)}~${Math.max(...wk).toFixed(1)}초`};
  const n = diffs.length, heat = last && last.heat;
  const level = (last && (n >= sc.rule.min || heat)) || (drift && planLate) ? "warn" : n || drift ? "look" : "ok";
  const all = diffs.map(d => STATE[d.k][d.lo ? 1 : 0][0]);
  const short = all.slice(0, 2).join(", ") + (all.length > 2 ? ` 외 ${all.length - 2}개` : "");
  const head = !last ? (drift ? "오늘 주행 기록은 없지만, 깜빡이 시점이 몇 주째 늦어지고 있어요" : "오늘 주행 기록이 아직 없어요")
    : level === "warn" ? `오늘의 운전 상태를 보니 주의가 필요해요${short ? ` (평소보다 ${short})` : heat ? " (더위 무반응)" : ""}`
    : n ? `대체로 평소 같지만 살펴볼 점이 있어요 (${short})`
    : drift ? "오늘은 평소 같지만, 몇 주 추세는 살펴보세요" : "오늘 운전은 평소와 같아요";
  if(Date.now() < restUntil) lines.unshift({t: "주행 중 졸음을 쫓는 조작이 있었어요", d: "창문·찬바람의 효과는 15분 안팎 · 쉬어 가세요"});
  const src = !last ? "" : last.kind === "live" ? `실제 주행 ${Math.round(last.minutes || 0)}분` : "시뮬레이션 주행";
  const X = i => 4 + i * 26, lo = Math.min(...wk) - .2, hi = Math.max(...wk) + .2, Y = v => 40 - (v - lo) / (hi - lo) * 34;
  const spark = `<svg viewBox="0 0 190 44" aria-label="최근 8주 계획 축"><polyline points="${wk.map((v, i) => `${X(i)},${Y(v)}`).join(" ")}" fill="none" stroke="var(--text-dim)" stroke-width="1.6"/>${wk.map((v, i) => `<circle cx="${X(i)}" cy="${Y(v)}" r="2.6" fill="${drift && i >= 4 ? "var(--c-h-gold)" : "var(--c-act-blue)"}"/>`).join("")}</svg>`;
  const why = diffs.length ? STATE[diffs[0].k][diffs[0].lo ? 1 : 0][1] : heat ? "더운데 공조를 안 바꿨어요" : drift ? trend.t : "";
  return {name: p.name, seat: "운전석", level, head, src, today: lines, trend, spark, why};
}

// 함께 탄 사람: 오늘 자리를 직접 고친 횟수를 그 사람 평소(최근 10회)와 비교 + 학습 추세
function seatReport(k){
  const [, label] = SEATS.find(x => x[0] === k), m = modes[k] || "";
  const j = judge(k);
  if(j && j.v === "guest") return {name: "손님", seat: label, level: "ok", head: "손님 자리예요 · 기본값으로 맞추고 기록하지 않아요", src: "", today: [], trend: null};
  if(j && (j.v === "new" || j.v === "pending")) return {name: SHORT[j.v], seat: label, level: "ok", src: "", today: [], trend: null,
    head: j.v === "new" ? `처음 탄 분이라 기본값으로 맞추고 배우기 시작했어요 (1/${READY}회)` : "누가 탔는지 아직 살펴보는 중이에요"};
  const o = personOf(k);
  if(!o) return null;
  const h = history(o), avg = a => a.reduce((x, d) => x + d.fixes, 0) / Math.max(1, a.length);
  const usual = avg(h.slice(-10)), early = avg(h.slice(0, READY));
  const live = car && car.fixes && car.fixes[k] != null;
  const today = live ? car.fixes[k] : Math.max(0, Math.round(usual + (rng(o.name + sc.id + (last ? last.kind : ""))() - 0.4) * 3));
  const more = today - usual >= 2;
  const lines = [{t: more ? "오늘 자리를 평소보다 자주 고쳤어요" : "오늘도 자리가 잘 맞았어요",
    d: `직접 고침 오늘 ${today}회 / 평소 ${usual.toFixed(1)}회${live ? "" : " (시뮬)"}${more ? " · 컨디션이나 옷차림이 달랐을 수 있어요" : ""}`}];
  if(m) lines.push({t: `${MODES[m][0]} 모드로 탔어요`, d: MODES[m][2]});
  const trend = o.n >= READY
    ? {t: early - usual >= 0.5 ? "자리가 이 사람에게 맞춰지고 있어요" : "자리 맞춤이 안정적이에요", d: `직접 고침 처음 ${early.toFixed(1)}회 → 최근 ${usual.toFixed(1)}회 · ${o.t}° · 바람 ${o.fan}단`}
    : {t: `아직 배우는 중이에요 (${o.n}/${READY}회)`, d: "더 타면 자리가 먼저 맞춰요"};
  return {name: o.name, seat: label, why: more ? lines[0].t : "", level: more ? "look" : "ok", head: more ? "오늘은 평소보다 불편했을 수 있어요" : "오늘도 평소처럼 편안했어요", src: "", today: lines, trend};
}

function reportData(){
  const people = [driverReport(sc.people[who])].concat(sc.occ.filter(k => k !== "DRIVER").map(seatReport).filter(Boolean));
  const warn = people.filter(x => x.level === "warn"), look = people.filter(x => x.level === "look");
  const title = warn.length ? `${warn.map(x => x.name).join("·")}님, 주의가 필요해요` : look.length ? `${look.map(x => x.name).join("·")}님, 살펴볼 점이 있어요` : "오늘 모두 평소와 같아요";
  return {title, warn: warn.length > 0, people};
}

function report(){
  const r = reportData();
  const line = l => `<div class="ln">${l.t}${l.d ? `<small>${l.d}</small>` : ""}</div>`;
  $("phone").innerHTML = `<button class="x" aria-label="닫기">×</button>
    <h4>시트룸 리포트</h4>
    <div class="m">${sc.title} · 탑승 ${r.people.length}명 · ${new Date().toTimeString().slice(0, 5)}</div>
    <div class="hl">${r.title}</div>
    ${r.people.map(x => `<div class="c ${x.level === "warn" ? "warn" : x.level === "ok" ? "ok" : ""}">
      <div class="ph">${x.name}<small>${x.seat}${x.src ? " · " + x.src : ""}</small><span class="lv ${x.level === "look" ? "" : x.level}">${LV[x.level]}</span></div>
      <div class="hl">${x.head}</div>
      ${x.today.length ? `<div class="sec">오늘</div>${x.today.map(line).join("")}` : ""}
      ${x.trend ? `<div class="sec">${x.seat === "운전석" ? "몇 주 추세" : "학습 추세"}</div>${line(x.trend)}${x.spark || ""}` : ""}
    </div>`).join("")}`;
  $("phone").hidden = false;
  $("phone").querySelector(".x").onclick = () => $("phone").hidden = true;
  $("reportLbl").textContent = "전송 완료 " + new Date().toTimeString().slice(0, 5);
  // 차 → 휴대폰 알림: 사람마다 한 줄(상태 + 첫 근거)
  const body = r.people.map(x => `${x.name}(${x.seat}) ${LV[x.level]}: ${x.head}${x.why && x.level !== "ok" ? " — " + x.why : ""}`).join("\n");
  toCar("sendReport", r.title, body, r.warn);
}

document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { tab = b.dataset.tab; show(); });
$("scnBtn").onclick = () => { sc = null; show(); };

const APP = !!window.Android;
if(APP) document.documentElement.classList.add("app");
function toCar(fn, ...a){ try{ if(APP && window.Android[fn]) window.Android[fn](...a.map(x => typeof x === "number" ? x : String(x))); } catch(e){} }
let car = null, prevOcc = null, lastTripT = 0, liveKey = "";
window.onCar = j => {
  car = j;
  $("liveTag").classList.add("on");
  if(j.co2 != null){ ppm = j.co2; liveCo2 = true; }
  if(j.gear){ const d = !!(j.driving || j.restricted); if(d !== driving){ driving = d; show(); } }
  if(!sc) return;
  let redraw = false;
  if(prevOcc){
    SEATS.forEach(([k]) => {
      const now = j.occ[k], was = prevOcc[k];
      if(now == null || was == null || now === was) return;
      if(now){ board(k, true); sel = k; } else { sc.occ = sc.occ.filter(x => x !== k); delete ids[k]; }
      redraw = true;
    });
  }
  prevOcc = {...j.occ};
  // 차에서 잰 손님 판정 근거로 갱신
  Object.entries(ids).forEach(([k, d]) => {
    const r = j.guest && j.guest[k];
    if(!d.live || !r) return;
    d.t = r.firstTemp; d.moved = !!r.moved; d.movedBy = r.movedBy || 0; d.seenLive = r.seen30 || 0;
  });
  if(j.recirc != null && j.recirc !== recirc){ recirc = j.recirc; }
  if(j.restLeftMs > 0) restUntil = Date.now() + j.restLeftMs;
  if(j.trip && j.trip.t !== lastTripT){
    const first = lastTripT === 0; lastTripT = j.trip.t;
    if(!first){
      const p = sc.people[who], v = j.trip.v, base = baseOf(p, j.trip.base);
      const changed = changedAxes(v, base), heat = sc.rule.heat > 0 && !!j.trip.heat;
      last = {kind: "live", v, base, changed, heat, sent: changed.length >= sc.rule.min || heat, minutes: j.trip.minutes};
      if(last.sent) toCar("notify", "today", "오늘 운전이 평소와 조금 달랐어요", advice(v, base).map(l => l.text).concat(heat ? [HEAT_ADVICE] : []).join('\n'));
      tab = "me"; redraw = true;
    }
  }
  const k2 = JSON.stringify([j.fixes, j.recirc, j.guest, j.setTemp, Math.round((j.co2 || 0) / 10)]);
  if(k2 !== liveKey){ liveKey = k2; if(!redraw && !driving && tab === "rooms"){ renderLearn(); renderAir(); } }
  if(redraw) show();
};

$("recirc").onclick = () => { recirc = !recirc; toCar("setRecirc", recirc); renderAir(); };
$("fresh").onclick = $("freshD").onclick = () => { recirc = false; toCar("setRecirc", false); show(); };
$("restBtn").onclick = () => { restUntil = Date.now() + 15 * 60000; renderAir(); };
$("sendReport").onclick = () => report();
$("gearD").onclick = () => { if(!sc) choose(0); driving = true; $("gearD").setAttribute("aria-pressed", true); $("gearP").setAttribute("aria-pressed", false); show(); };
$("gearP").onclick = () => { driving = false; $("gearP").setAttribute("aria-pressed", true); $("gearD").setAttribute("aria-pressed", false); show(); };

setInterval(() => {
  if(!sc) return;
  if(!liveCo2){
    const n = sc.occ.length;
    ppm += recirc ? n * 16 : -(ppm - 420) * 0.15;
    ppm = Math.max(420, Math.min(3000, ppm));
  }
  if(driving) renderDrive();
  else if(tab === "rooms") renderAir();
}, 1000);

show();
</script>
</body>
</html>
